name: helm
on:
  pull_request:
  push:
    branches: [HELM_MAIN_BRANCH]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # HELM_TOOLCHAIN_STEPS
      - name: helm full check
        run: .helm/check.sh full
        env:
          HELM_BASE: ${{ github.event.pull_request.base.sha }}
